name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            build_type: Release
          - os: ubuntu-latest
            name: linux_x86_64
            build_type: Release
          - os: macos-15
            name: macOS-arm64
            build_type: Release
            triplet: arm64-osx
          - os: macos-13
            name: macOS-x64
            build_type: Release
            triplet: x64-osx

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- macOS: выбрать Xcode ---
      - name: List Xcode installations
        if: runner.os == 'macOS'
        run: sudo ls -1 /Applications | grep "Xcode"

      - name: Select Xcode 16.2
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      # --- Linux: JUCE-зависимости ---
      - name: Install JUCE dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      # --- Кэш подмодулей (JUCE, googletest) ---
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: libs
          key: ${{ runner.os }}-libs-${{ hashFiles('CMakeLists.txt') }}

      # --- Configure: без preset'ов, напрямую ---
      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS="${{ runner.os == 'Windows' && '/WX-' || '-Wno-error' }}"

      # --- Build ---
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # --- Fix JUCE trailing commas in moduleinfo.json (Windows) ---
      - name: Fix JUCE trailing commas
        shell: bash
        run: |
          python3 -c "
          import os, re
          for root, dirs, files in os.walk('build'):
              for file in files:
                  if file == 'moduleinfo.json':
                      path = os.path.join(root, file)
                      with open(path, 'r+') as f:
                          text = f.read()
                          fixed = re.sub(r',(\s*[\]}])', r'\1', text)
                          f.seek(0)
                          f.write(fixed)
                          f.truncate()
          "

      # --- Tests (только если цель собралась) ---
      - name: Build tests
        run: cmake --build build --config ${{ matrix.build_type }} --target AudioPluginTest || echo "Tests target not available"

      - name: Run tests
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure || true

      # --- Upload артефактов ---
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Toposhaper-${{ matrix.name }}-VST3
          path: |
            build/**/Toposhaper_artefacts/${{ matrix.build_type }}/VST3/*.vst3/**
            build/**/Toposhaper.vst3/**
          if-no-files-found: warn

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Toposhaper-${{ matrix.name }}-Standalone
          path: |
            build/**/Toposhaper_artefacts/${{ matrix.build_type }}/Standalone/*.exe
            build/**/Toposhaper_artefacts/${{ matrix.build_type }}/Standalone/*.app/**
            build/**/Toposhaper_artefacts/${{ matrix.build_type }}/Standalone/Toposhaper
          if-no-files-found: warn

      - name: Upload AU (macOS only)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Toposhaper-${{ matrix.name }}-AU
          path: build/**/Toposhaper_artefacts/${{ matrix.build_type }}/AU/*.component/**
          if-no-files-found: warn