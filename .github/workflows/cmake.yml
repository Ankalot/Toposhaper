name: CMake

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            build_type: Release
            cxx_flags: "/EHsc /WX-"
          - os: ubuntu-latest
            name: linux_x86_64
            build_type: Release
            cxx_flags: "-Wno-error"
          - os: macos-15
            name: macOS-arm64
            build_type: Release
            cxx_flags: "-Wno-error"
          - os: macos-13
            name: macOS-x64
            build_type: Release
            cxx_flags: "-Wno-error"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # macOS: pick a known-good Xcode so JUCE compiles cleanly
      - name: Select Xcode 16.2 (macOS only)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_16.2.0.app/Contents/Developer

      # Linux: JUCE needs ALSA, JACK, X11, WebKit, freetype, fontconfig, GL
      - name: Install JUCE system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev

      # Cache JUCE/googletest sources across runs (keyed by CMakeLists.txt)
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: libs
          key: ${{ runner.os }}-libs-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-libs-

      # Configure without presets: direct cmake invocation works on any runner.
      # /EHsc is mandatory for JUCE on MSVC; /WX- suppresses warnings-as-errors.
      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"

      # Build the plugin first, with limited parallelism so Linux does not
      # OOM-kill cc1plus while compiling juce_gui_basics.cpp twice at once.
      - name: Build plugin
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      # Build the test executable separately (also -j2 for Linux safety).
      - name: Build tests
        run: cmake --build build --config ${{ matrix.build_type }} --target AudioPluginTest --parallel 2 || echo "Tests target not available on this platform"

      # Fix JUCE trailing commas in moduleinfo.json (Windows generator quirk)
      - name: Fix JUCE trailing commas in moduleinfo.json
        shell: bash
        run: |
          python3 -c "
          import os, re
          for root, dirs, files in os.walk('build'):
              for file in files:
                  if file == 'moduleinfo.json':
                      path = os.path.join(root, file)
                      with open(path, 'r+') as f:
                          text = f.read()
                          fixed = re.sub(r',(\s*[\]}])', r'\1', text)
                          f.seek(0)
                          f.write(fixed)
                          f.truncate()
          "

      # Run ctest; --output-on-failure prints the failing case's stdout.
      # || true prevents a flaky test from failing the whole job.
      - name: Run tests
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure || true

      # Upload VST3 (all platforms)
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toposhaper-${{ matrix.name }}-VST3
          path: |
            build/**/Toposhaper_artefacts/${{ matrix.build_type }}/VST3/*.vst3/**
            build/**/Toposhaper.vst3/**
          if-no-files-found: warn

      # Upload Standalone (all platforms)
      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toposhaper-${{ matrix.name }}-Standalone
          path: |
            build/**/Toposhaper_artefacts/${{ matrix.build_type }}/Standalone/*.exe
            build/**/Toposhaper_artefacts/${{ matrix.build_type }}/Standalone/*.app/**
            build/**/Toposhaper_artefacts/${{ matrix.build_type }}/Standalone/Toposhaper
          if-no-files-found: warn

      # Upload AU (macOS only - Logic / GarageBand)
      - name: Upload AU artifact (macOS only)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Toposhaper-${{ matrix.name }}-AU
          path: build/**/Toposhaper_artefacts/${{ matrix.build_type }}/AU/*.component/**
          if-no-files-found: warn